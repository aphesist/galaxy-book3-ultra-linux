# Hide the IPU6 ISYS raw capture nodes (32 "ipu6" V4L2 devices). They are
# not usable cameras; the real webcam is libcamera's "Built-in Front Camera".
monitor.v4l2.rules = [
  {
    matches = [
      { device.api = "v4l2", device.bus-path = "pci-0000:00:05.0" }
    ]
    actions = { update-props = { device.disabled = true } }
  }
]
